{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="mb-0"><i class="bi bi-people"></i> Quản lý người dùng</h3>
        <small class="text-muted">Danh sách tài khoản đang có trong hệ thống CampHub.</small>
    </div>
    <span class="badge text-bg-primary" style="background-color: #4a7c2c !important;">{{ users|length }} người dùng</span>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr style="background: linear-gradient(135deg, #4a7c2c 0%, #2d5016 100%); color: white;">
                        <th style="color: white;">ID</th>
                        <th style="color: white;">Tên đăng nhập</th>
                        <th style="color: white;">Vai trò</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user['id'] }}</td>
                        <td><strong>{{ user['username'] }}</strong></td>
                        <td><span class="badge {% if user['role'] == 'admin' %}text-bg-danger{% else %}text-bg-info{% endif %}">{{ user['role'] }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
