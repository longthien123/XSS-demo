{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="mb-0">Quan ly nguoi dung</h3>
        <small class="text-muted">Danh sach tai khoan dang co trong he thong.</small>
    </div>
    <span class="badge text-bg-secondary">{{ users|length }} nguoi dung</span>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user['id'] }}</td>
                        <td>{{ user['username'] }}</td>
                        <td><span class="badge {% if user['role'] == 'admin' %}text-bg-dark{% else %}text-bg-secondary{% endif %}">{{ user['role'] }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
