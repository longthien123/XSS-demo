{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="mb-3">Dang nhap</h3>
                <form method="post" class="vstack gap-3">
                    <div>
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Nhap username" required>
                    </div>
                    <div>
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Nhap password" required>
                    </div>
                    <button type="submit" class="btn btn-dark">Dang nhap</button>
                </form>

                <hr>
                <p class="small text-muted mb-0">
                    Tai khoan admin mac dinh: <strong>admin / admin123</strong>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
