{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div style="background: linear-gradient(135deg, #4a7c2c 0%, #2d5016 100%); height: 60px; display: flex; align-items: center; justify-content: center; font-size: 30px; border-radius: 14px 14px 0 0;">
                🏕️
            </div>
            <div class="card-body p-4">
                <h3 class="mb-2" style="color: #2d5016;"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</h3>
                <p class="text-muted small mb-4">Truy cập tài khoản CampHub của bạn</p>
                <form method="post" class="vstack gap-3">
                    <div>
                        <label class="form-label"><strong>Tên đăng nhập</strong></label>
                        <input type="text" name="username" class="form-control" placeholder="Nhập username" required>
                    </div>
                    <div>
                        <label class="form-label"><strong>Mật khẩu</strong></label>
                        <input type="password" name="password" class="form-control" placeholder="Nhập password" required>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</button>
                </form>

                <hr>
                <p class="small text-muted mb-0">
                    📝 Demo: <strong>admin / admin123</strong><br>
                    <a href="{{ url_for('register') }}">Chưa có tài khoản? Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
