{% extends 'base.html' %}
{% block content %}
<section class="hero-card p-4 p-md-5 rounded-4 shadow-sm mb-4" style="background: linear-gradient(135deg, #4a7c2c 0%, #2d5016 100%); color: white;">
    <div class="row align-items-center">
        <div class="col-lg-8">
            <span class="badge text-bg-light mb-3"><i class="bi bi-graph-up"></i> Bảng điều khiển</span>
            <h1 class="display-6 fw-bold mb-3">Quản lý CampHub</h1>
            <p class="lead mb-0">
                Quản lý người dùng, khách hàng và các yêu cầu từ khách thuê lều.
            </p>
        </div>
    </div>
</section>

<section class="row g-3 mb-4">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h5><i class="bi bi-people"></i> Tổng người dùng</h5>
                <div class="display-6 fw-bold" style="color: #4a7c2c;">{{ total_users }}</div>
                <a href="{{ url_for('admin_users') }}" class="btn btn-outline-success mt-2">Quản lý người dùng</a>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h5><i class="bi bi-chat-left"></i> Tổng bình luận</h5>
                <div class="display-6 fw-bold" style="color: #4a7c2c;">{{ total_comments }}</div>
                <a href="{{ url_for('admin_comments') }}" class="btn btn-primary mt-2">Quản lý bình luận</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
